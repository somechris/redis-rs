name: Rust

on:
  push:
    branches: [main, 0.*.x, 1.*.x]
  pull_request:
    branches: [main, 0.*.x, 1.*.x]

env:
  CARGO_TERM_COLOR: always
  REDISRS_REDIS_JSON_PATH: "/tmp/librejson.so"
  REDISRS_REDIS_BLOOM_PATH: "/tmp/redisbloom.so"

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id || github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-test:
    needs: []
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix: &db-matrix
        config: [
            # The databases to test with
            #
            # People typically test using recent versions locally. So, to be mindful of resources,
            # CI only tests against the _earliest_ minor for each major version, with latest patch.
            #
            # If minor versions are sufficiently different, CI also tests against the latest minor.
            #
            # When making changes here, also update `README.md` accordingly (grep for `CI runs against`).
            {  db-org: redis, db-name: redis, db-version: 6.2.24 },
            {  db-org: redis, db-name: redis, db-version: 7.0.15, json-module-version: v2.6.22 },
            {  db-org: redis, db-name: redis, db-version: 7.4.11, json-module-version: v2.6.22 },
            {  db-org: redis, db-name: redis, db-version: 8.0.6, json-module-version: bundled, bloom-module-version: bundled },
            {  db-org: redis, db-name: redis, db-version: 8.10.2, json-module-version: bundled, bloom-module-version: bundled },
            # valkey-bloom has some quirks with Valkey <8.1, so we only test it on >=8.1
            {  db-org: valkey-io, db-name: valkey, db-version: 7.2.14, json-module-version: v2.6.22 },
            {  db-org: valkey-io, db-name: valkey, db-version: 8.0.11, json-module-version: v2.6.22 },
            # Skipping Valkey 8.1 as it's too similar to 8.0
            {  db-org: valkey-io, db-name: valkey, db-version: 9.0.6, json-module-version: v2.6.22, bloom-module-version: "valkey-bloom:1.0.1" },
            # Skipping Valkey 9.1 as it's too similar to 9.0
            #
            # KeyDB (#2203), Dragonfly (#2204), Kvrocks, ... are implicitly supported, but this support is not tested.
          ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache RedisJSON
        if: matrix.config.json-module-version != '' && matrix.config.json-module-version != 'bundled'
        id: cache-redisjson
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/librejson.so
          key: ${{ runner.os }}-redisjson-${{ matrix.config.json-module-version }}

      - name: Install DB
        uses: ./.github/actions/install-db
        with:
          db-org: ${{ matrix.config.db-org }}
          db-name: ${{ matrix.config.db-name }}
          db-version: ${{ matrix.config.db-version }}

      - name: Copy bundled RedisJSON into place
        if: matrix.config.json-module-version == 'bundled'
        run: |
          cp "$HOME/db/rejson.so" "$REDISRS_REDIS_JSON_PATH"

      - name: Copy bundled RedisBloom into place
        if: matrix.config.bloom-module-version == 'bundled'
        run: |
          cp "$HOME/db/redisbloom.so" "$REDISRS_REDIS_BLOOM_PATH"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: nextest

      - name: Checkout RedisJSON
        if: steps.cache-redisjson.outputs.cache-hit != 'true' && matrix.config.json-module-version != '' && matrix.config.json-module-version != 'bundled'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "RedisJSON/RedisJSON"
          path: "./__ci/redis-json"
          ref: ${{ matrix.config.json-module-version }}
          set-safe-directory: false

      - name: Compile RedisJSON
        if: steps.cache-redisjson.outputs.cache-hit != 'true' && matrix.config.json-module-version != '' && matrix.config.json-module-version != 'bundled'
        run: |
          cp ./Cargo.toml ./Cargo.toml.actual
          echo $'\nexclude = [\"./__ci/redis-json\"]' >> Cargo.toml
          cargo +stable build --release --manifest-path ./__ci/redis-json/Cargo.toml
          mv ./__ci/redis-json/target/release/librejson.so ${{ env.REDISRS_REDIS_JSON_PATH }}
          rm ./Cargo.toml; mv ./Cargo.toml.actual ./Cargo.toml
          rm -rf ./__ci/redis-json

      - name: Verify RedisJSON module
        if: matrix.config.json-module-version != ''
        run: |
          if [ ! -f "${{ env.REDISRS_REDIS_JSON_PATH }}" ]; then
            echo "ERROR: RedisJSON module not found at ${{ env.REDISRS_REDIS_JSON_PATH }}"
            exit 1
          fi
          ls -lh "${{ env.REDISRS_REDIS_JSON_PATH }}"

          # Test that Redis can load the module
          echo "Testing Redis server with module..."
          TEST_PORT=16379
          TEST_LOG="/tmp/redis-module-test.log"
          redis-server --port $TEST_PORT --loadmodule "${{ env.REDISRS_REDIS_JSON_PATH }}" \
            --logfile "$TEST_LOG" --daemonize yes || {
            echo "ERROR: Failed to start Redis with module"
            cat "$TEST_LOG"
            exit 1
          }

          sleep 2

          if redis-cli -p $TEST_PORT PING; then
            echo "Redis server started successfully"
            redis-cli -p $TEST_PORT JSON.SET test \$ '{"test":1}' || {
              echo "ERROR: JSON commands not working"
              cat "$TEST_LOG"
              redis-cli -p $TEST_PORT SHUTDOWN NOSAVE
              exit 1
            }
            echo "JSON commands are working"
            echo "Loaded modules:"
            redis-cli -p $TEST_PORT --no-raw MODULE LIST
            redis-cli -p $TEST_PORT SHUTDOWN NOSAVE
          else
            echo "ERROR: Redis server not responding"
            cat "$TEST_LOG"
            exit 1
          fi

      - name: Load Valkey Bloom module from cache
        if: startsWith(matrix.config.bloom-module-version, 'valkey-bloom:')
        id: cache-valkey-bloom
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/valkey-bloom/target/release/libvalkey_bloom.so
          key: v2${{ runner.os }}-valkey-bloom-${{ matrix.config.bloom-module-version }}

      - name: Echo vars
        run: |
          echo 1 ${{steps.cache-valkey-bloom.outputs.cache-hit}} Z
          echo 2 ${{steps.cache-valkey-bloom.cache-hit}} Z

      - name: Build Valkey Bloom repo
        if: startsWith(matrix.config.bloom-module-version, 'valkey-bloom:') && steps.cache-valkey-bloom.output.cache-hit != 'true'
        env:
          VALKEY_BLOOM: ${{matrix.config.bloom-module-version}}
        shell: bash
        run: |
          # Fetch and unpack valkey-bloom's code
          cd /tmp
          wget "https://github.com/valkey-io/valkey-bloom/archive/refs/tags/${VALKEY_BLOOM#*:}.tar.gz"
          tar -xzvf "${VALKEY_BLOOM#*:}.tar.gz"
          rm -rf "valkey-bloom"
          mv "valkey-bloom-${VALKEY_BLOOM#*:}" "valkey-bloom"

          # Build it
          cd "valkey-bloom"
          RUSTFLAGS="-D warnings" cargo build --all --all-targets  --release

      - name: Copy Valkey Bloom into place
        if: startsWith(matrix.config.bloom-module-version, 'valkey-bloom:')
        run: |
          cp /tmp/valkey-bloom/target/release/libvalkey_bloom.so "$REDISRS_REDIS_BLOOM_PATH"

      - name: Run RedisBloom tests
        if: matrix.config.bloom-module-version != ''
        run: make test-module-bloom

      - name: Cache RedisJSON
        if: matrix.config.json-module-version != '' && matrix.config.json-module-version != 'bundled'
        id: cache-redisjson-save
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.REDISRS_REDIS_JSON_PATH }}
          key: ${{ runner.os }}-redisjson-${{ matrix.config.json-module-version }}

  examples:
    needs: [build-and-test]
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: *db-matrix

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install DB
        uses: ./.github/actions/install-db
        with:
          db-org: ${{ matrix.config.db-org }}
          db-name: ${{ matrix.config.db-name }}
          db-version: ${{ matrix.config.db-version }}

      - name: Load Valkey Bloom module from cache
        if: startsWith(matrix.config.bloom-module-version, 'valkey-bloom:')
        id: cache-valkey-bloom
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/valkey-bloom/target/release/libvalkey_bloom.so
          key: v2${{ runner.os }}-valkey-bloom-${{ matrix.config.bloom-module-version }}

      - name: Copy Valkey Bloom into place
        if: startsWith(matrix.config.bloom-module-version, 'valkey-bloom:')
        run: |
          cp /tmp/valkey-bloom/target/release/libvalkey_bloom.so "$REDISRS_REDIS_BLOOM_PATH"

      - name: Copy bundled RedisBloom into place
        if: matrix.config.bloom-module-version == 'bundled'
        run: |
          cp "$HOME/db/redisbloom.so" "$REDISRS_REDIS_BLOOM_PATH"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Start Redis
        run: |
          EXTRA_OPTS=()
          if [ -e "$REDISRS_REDIS_BLOOM_PATH" ]
          then
            echo "Adding module '$REDISRS_REDIS_BLOOM_PATH'"
            EXTRA_OPTS+=("--loadmodule" "$REDISRS_REDIS_BLOOM_PATH")
          fi
          redis-server "${EXTRA_OPTS[@]}" &

      - name: basic
        run: cargo run --example basic
      - name: streams
        run: cargo run --example streams
      - name: typed
        run: cargo run --example typed --features tokio-comp
      - name: geospatial
        run: cargo run --example geospatial
      - name: async-await
        run: cargo run --example async-await --features tokio-comp
      - name: async-typed
        run: cargo run --example async-typed --features tokio-comp
      - name: async-caching
        run: cargo run --example async-caching --features tokio-comp,cache-aio
      - name: async-connection-loss
        run: cargo run --example async-connection-loss --features tokio-comp,connection-manager -- reconnect
      - name: async-multiplexed
        run: cargo run --example async-multiplexed --features tokio-comp
      - name: async-resp2-pub-sub
        run: cargo run --example async-resp2-pub-sub --features tokio-comp
      - name: async-resp3-pub-sub
        run: cargo run --example async-resp3-pub-sub --features tokio-comp,connection-manager
      - name: async-scan
        run: cargo run --example async-scan --features tokio-comp
      - name: module bloom
        if: matrix.config.bloom-module-version != ''
        run: cargo run --example bloom --features bloom
